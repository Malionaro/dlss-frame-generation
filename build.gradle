plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            def quickPlayWorld = System.getenv("DLSS_FG_QUICK_PLAY_WORLD")
            if (quickPlayWorld) {
                programArgs "--quickPlaySingleplayer", quickPlayWorld
            }
            // Force the Vulkan renderer for mod development: every dlss_fg feature
            // requires Mojang's VulkanDevice, and the in-game setting can silently
            // reset to OpenGL after an unexpected shutdown.
            programArgs "--graphicsBackend", "vulkan"
            // Silence LWJGL's restricted native-access warnings on modern JDKs
            // (System::load / Unsafe) and future-proof the dev client: without
            // this, restricted methods will be blocked in a future release.
            vmArgs "--enable-native-access=ALL-UNNAMED"
        }
    }

    mods {
        "dlss_fg" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // 21.x is the first ModMenu line that supports Minecraft 26.3.
    clientCompileOnly "com.terraformersmc:modmenu:20.0.3"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

test {
    useJUnitPlatform()
    // Same LWJGL native-access rationale as the loom client run above:
    // tests touch LWJGL classes, keep the warnings out of the log.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

def nativeSourceDirectory = layout.projectDirectory.dir("native")
def nativeBuildDirectory = layout.buildDirectory.dir("native")

// The JNI bridge is Windows-only: it links d3d12/dxgi, uses the Streamline
// import library and calls into the DXGI presenter. CMake's non-Windows branch
// only exists so `cmake -S native -B ...` configures, it cannot compile these
// translation units. Without this gate every `test` run on Linux/macOS fails in
// `buildNative`, because `test` -> `processTestResources` -> `classes` ->
// `processResources` -> `copyNative` -> `buildNative`.
def nativeHostIsWindows =
        System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("win")
def nativeBuildSupported = {
    nativeHostIsWindows && nativeSourceDirectory.file("CMakeLists.txt").asFile.isFile()
            && file("native/streamline").isDirectory()
}

def findCMakeExecutable = {
    def executableName = nativeHostIsWindows ? "cmake.exe" : "cmake"
    def candidates = []
    def pathValue = System.getenv("PATH")
    if (pathValue) {
        pathValue.split(File.pathSeparator).each { entry ->
            if (entry) {
                candidates.add(new File(entry, executableName))
            }
        }
    }
    if (executableName == "cmake.exe") {
        candidates.add(new File("C:/Program Files/CMake/bin/cmake.exe"))
    }
    candidates.find { it.isFile() }?.absolutePath
}

def cmakeExecutable = findCMakeExecutable()

tasks.register("buildNative", Exec) {
    group = "build"
    description = "Builds the JNI bridge when its source and SDK files are present."
    dependsOn("configureNative")
    onlyIf(nativeBuildSupported)
    // D11: declared inputs (bridge sources + CMakeLists) and outputs so the
    // Exec re-runs exactly when sources change and skips otherwise. The output
    // overlap with configureNative is covered by the explicit dependsOn.
    inputs.file(nativeSourceDirectory.file("CMakeLists.txt"))
    inputs.dir(nativeSourceDirectory.dir("bridge"))
    // D11: declared outputs so Gradle can skip the Exec when nothing changed
    // (dependency on configureNative makes the overlap with its output dir explicit).
    outputs.files(
        layout.buildDirectory.file("native/Release/dlss_fg_native.dll"),
        layout.buildDirectory.file("native/dlss_fg_native.dll"),
        layout.buildDirectory.file("native/libdlss_fg_native.so"),
        layout.buildDirectory.file("native/Release/libdlss_fg_native.so"),
        layout.buildDirectory.file("native/libdlss_fg_native.dylib"),
        layout.buildDirectory.file("native/Release/libdlss_fg_native.dylib")
    )
    doFirst {
        if (cmakeExecutable == null) {
            throw new GradleException("CMake is required to build the JNI bridge. Install CMake or add it to PATH.")
        }
    }
    commandLine cmakeExecutable ?: "cmake", "--build", nativeBuildDirectory.get().asFile, "--config", "Release"
}

tasks.register("configureNative", Exec) {
    group = "build"
    description = "Configures the JNI bridge when its source and SDK files are present."
    inputs.file(nativeSourceDirectory.file("CMakeLists.txt"))
    inputs.dir(nativeSourceDirectory.dir("bridge"))
    inputs.property("cmakeExecutable", cmakeExecutable ?: "cmake")
    outputs.dir(nativeBuildDirectory)
    onlyIf(nativeBuildSupported)
    doFirst {
        if (cmakeExecutable == null) {
            throw new GradleException("CMake is required to build the JNI bridge. Install CMake or add it to PATH.")
        }
    }
    commandLine cmakeExecutable ?: "cmake", "-S", nativeSourceDirectory.asFile, "-B", nativeBuildDirectory.get().asFile
}

tasks.register("copyNative") {
    group = "build"
    description = "Copies the JNI native library into resource folder."
    dependsOn("buildNative")
    onlyIf(nativeBuildSupported)
    // D11: declared inputs/outputs for correct incrementality and caching.
    def nativeOutBase = layout.buildDirectory.dir("native-resources/natives")
    inputs.dir(nativeBuildDirectory)
    outputs.dir(nativeOutBase)
    doLast {
        def outBase = nativeOutBase.get().asFile
        def candidates = [
            [file: new File(nativeBuildDirectory.get().asFile, "Release/dlss_fg_native.dll"), sub: "windows"],
            [file: new File(nativeBuildDirectory.get().asFile, "dlss_fg_native.dll"), sub: "windows"],
            [file: new File(nativeBuildDirectory.get().asFile, "libdlss_fg_native.so"), sub: "linux"],
            [file: new File(nativeBuildDirectory.get().asFile, "Release/libdlss_fg_native.so"), sub: "linux"],
            [file: new File(nativeBuildDirectory.get().asFile, "libdlss_fg_native.dylib"), sub: "macos"],
            [file: new File(nativeBuildDirectory.get().asFile, "Release/libdlss_fg_native.dylib"), sub: "macos"]
        ]
        candidates.each { c ->
            if (c.file.isFile()) {
                def destDir = new File(outBase, c.sub)
                destDir.mkdirs()
                def dest = new File(destDir, c.file.name)
                dest.bytes = c.file.bytes
                logger.lifecycle("Copied native ${c.file.name} -> ${dest}")
            }
        }
    }
}

// Copy Streamline SDK runtime DLLs (interposer, plugins, NGX binaries) into natives
tasks.register("copyStreamlineRuntime", Copy) {
    group = "build"
    description = "Copies NVIDIA Streamline SDK runtime DLLs into native resource folder."
    // These are Windows DLLs; a Linux/macOS JAR would only carry dead weight.
    onlyIf { nativeHostIsWindows && file("native/streamline/bin/x64").isDirectory() }

    from("native/streamline/bin/x64") {
        include "sl.interposer.dll"
        include "sl.common.dll"
        include "sl.dlss_g.dll"
        include "sl.dlss.dll"
        include "sl.dlss_d.dll"
        include "sl.reflex.dll"
        include "sl.pcl.dll"
        include "nvngx_dlssg.dll"
        include "nvngx_dlss.dll"
        include "nvngx_dlssd.dll"
        include "NvLowLatencyVk.dll"
    }
    into layout.buildDirectory.dir("native-resources/natives/windows")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

def optiScalerVersion = "v0.9.4"
def optiScalerVendorDirectory =
        layout.projectDirectory.dir("vendor/optiscaler/${optiScalerVersion}")
def optiScalerRuntimeDirectory = optiScalerVendorDirectory.dir("runtime")
def requiredOptiScalerFiles = [
        "OptiScaler.dll",
        "OptiScaler.ini",
        "amd_fidelityfx_dx12.dll",
        "amd_fidelityfx_upscaler_dx12.dll",
        "amd_fidelityfx_vk.dll",
        "libxess.dll",
        "D3D12_Optiscaler/D3D12Core.dll",
        "Licenses/DirectX_LICENSE.txt",
        "Licenses/FidelityFX_v1_LICENSE.md",
        "Licenses/FidelityFX_v2_LICENSE.md",
    "Licenses/XeSS_LICENSE.txt",
]

// The exact same signed Vulkan provider belongs to the verified OptiScaler
// bundle. Reuse that one source file instead of maintaining a second binary
// copy under native/fidelityfx.
tasks.register("copyFidelityFxRuntime", Copy) {
    group = "build"
    description = "Copies the bundled AMD FidelityFX Vulkan runtime into the native resource folder."
    dependsOn("copyOptiScalerBundle")

    from(optiScalerRuntimeDirectory) {
        include "amd_fidelityfx_vk.dll"
    }
    into layout.buildDirectory.dir("native-resources/natives/windows")
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register("copyOptiScalerBundle", Copy) {
    group = "build"
    description = "Packages the verified OptiScaler runtime and redistribution notices for one-JAR installation."

    inputs.files(requiredOptiScalerFiles.collect {
        optiScalerRuntimeDirectory.file(it)
    })
    inputs.files(
            optiScalerVendorDirectory.file("VERSION.txt"),
            optiScalerVendorDirectory.file("SHA256SUMS.txt"),
            optiScalerVendorDirectory.file("legal/GPL-3.0.txt"),
            optiScalerVendorDirectory.file("legal/CORRESPONDING_SOURCE.txt")
    )

    doFirst {
        def missing = requiredOptiScalerFiles.findAll {
            !optiScalerRuntimeDirectory.file(it).asFile.isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "The embedded OptiScaler ${optiScalerVersion} bundle is incomplete: "
                            + missing.join(", ")
            )
        }
    }

    from(optiScalerRuntimeDirectory) {
        into "optiscaler/windows"
    }
    from(optiScalerVendorDirectory) {
        include "VERSION.txt"
        include "SHA256SUMS.txt"
        include "legal/GPL-3.0.txt"
        include "legal/CORRESPONDING_SOURCE.txt"
        into "META-INF/optiscaler/${optiScalerVersion}"
    }
    into layout.buildDirectory.dir("optiscaler-resources")
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.register("compileShaders") {
    group = "build"
    description = "Compiles GLSL Vulkan shader sources to SPIR-V using glslc."
    
    def shaderSourceDir = file("src/main/resources/assets/dlss_fg/shaders/source")
    def shaderOutputDir = layout.buildDirectory.dir("shader-resources/assets/dlss_fg/shaders")

    if (shaderSourceDir.exists()) {
        inputs.dir(shaderSourceDir).optional()
    }
    outputs.dir(shaderOutputDir)

    doLast {
        if (!shaderSourceDir.exists()) {
            return
        }

        // Find glslc executable
        def glslcPath = null
        def vulkanSdk = System.getenv("VULKAN_SDK")
        if (vulkanSdk != null) {
            def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
            def exeExtension = osName.contains("win") ? ".exe" : ""
            def sdkGlslc = new File(vulkanSdk, "bin/glslc${exeExtension}")
            if (sdkGlslc.exists()) {
                glslcPath = sdkGlslc.absolutePath
            }
        }

        if (glslcPath == null) {
            // Check PATH
            try {
                def process = "glslc --version".execute()
                process.waitFor()
                if (process.exitValue() == 0) {
                    glslcPath = "glslc"
                }
            } catch (Exception ignored) {}
        }

        def shaderFiles = fileTree(shaderSourceDir) {
            include "**/*.comp"
            include "**/*.vert"
            include "**/*.frag"
        }.files
        if (shaderFiles.isEmpty()) {
            return
        }

        // Find spirv-val executable for SPIR-V validation (D11: fail build on invalid SPIR-V)
        def spirvValPath = null
        if (vulkanSdk != null) {
            def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
            def exeExtension = osName.contains("win") ? ".exe" : ""
            def sdkSpirvVal = new File(vulkanSdk, "bin/spirv-val${exeExtension}")
            if (sdkSpirvVal.exists()) {
                spirvValPath = sdkSpirvVal.absolutePath
            }
        }
        if (spirvValPath == null) {
            try {
                def versionCheck = "spirv-val --version".execute()
                versionCheck.waitFor()
                if (versionCheck.exitValue() == 0) {
                    spirvValPath = "spirv-val"
                }
            } catch (Exception ignored) {}
        }

        if (glslcPath == null) {
            // D11: loud instead of silently green — the jar still ships shader
            // sources for the runtime shaderc fallback, but no offline SPIR-V
            // was produced or validated in this build.
            logger.warn("Standalone glslc not found; runtime shaderc will compile active Vulkan shaders. "
                    + "No offline SPIR-V artifacts or spirv-val results were produced by compileShaders.")
            return
        }

        def outputDirFile = shaderOutputDir.get().asFile
        if (!outputDirFile.exists()) {
            outputDirFile.mkdirs()
        }

        shaderFiles.each { File file ->
            def relativePath = shaderSourceDir.toPath().relativize(file.toPath()).toString()
            def outputFile = new File(outputDirFile, "${relativePath}.spv")
            outputFile.parentFile.mkdirs()
            println "Compiling Vulkan shader: ${relativePath} -> ${outputFile.name}"
            def process = [glslcPath, file.absolutePath, "-o", outputFile.absolutePath].execute()
            process.waitFor()
            if (process.exitValue() != 0) {
                throw new GradleException("Failed to compile shader ${relativePath}:\n${process.errorStream.text}")
            }
            if (spirvValPath != null) {
                def validate = [spirvValPath, outputFile.absolutePath].execute()
                validate.waitFor()
                if (validate.exitValue() != 0) {
                    throw new GradleException("spirv-val rejected shader ${relativePath}:\n${validate.errorStream.text}")
                }
            } else {
                logger.warn("spirv-val not found; SPIR-V validation skipped for ${relativePath}")
            }
        }
    }
}

processResources {
    dependsOn(compileShaders)
    dependsOn(copyNative)
    dependsOn(copyStreamlineRuntime)
    dependsOn(copyFidelityFxRuntime)
    dependsOn(copyOptiScalerBundle)

    // Include JNI native libraries if they were built
    from(layout.buildDirectory.dir("native-resources")) {
        include "natives/**"
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    // Include compiled shaders if they were built
    from(layout.buildDirectory.dir("shader-resources")) {
        include "assets/dlss_fg/shaders/**"
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    from(layout.buildDirectory.dir("optiscaler-resources")) {
        include "optiscaler/**"
        include "META-INF/optiscaler/**"
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }

    from("native/streamline") {
        include "license.txt"
        include "3rd-party-licenses.md"
        into "META-INF/licenses/nvidia-streamline"
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }
    from("native/streamline/bin/x64") {
        include "nvngx_dlss.license.txt"
        include "reflex.license.txt"
        into "META-INF/licenses/nvidia-streamline"
        duplicatesStrategy = DuplicatesStrategy.FAIL
    }

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version
    filteringCharset = "UTF-8"

    // Resolve project properties at configuration time: Task.project access
    // inside the filesMatching closure runs at execution time and is
    // deprecated (breaks in Gradle 10 / with the configuration cache).
    def modVersion = project.version
    def mcVersion = project.minecraft_version
    def loaderVersion = project.loader_version
    def fabricVersion = project.fabric_version
    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": mcVersion,
                "loader_version": loaderVersion,
                "fabric_version": fabricVersion
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    // Resolve at configuration time: Task.project access inside the rename
    // closure runs at execution time, which is deprecated in Gradle 9 and a hard
    // error in Gradle 10 (it also blocks the configuration cache).
    def licenseFileName = "LICENSE.txt_${project.archives_base_name}"
    from("LICENSE.txt") {
        rename { licenseFileName }
    }
    from("THIRD_PARTY_NOTICES.md")
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
