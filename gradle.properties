# Done to increase the memory available to gradle.
# 2G is the practical floor for Loom: it decompiles and remaps Minecraft plus
# the mod classes, and 1G makes the daemon thrash or die on the remap step.
org.gradle.jvmargs=-Xmx2G
# NOTE: do NOT pin org.gradle.java.home here - CI runners and other machines
# do not have the same JDK path, and Gradle fails hard on an invalid path.
# If your PATH java is older than Java 25 (required, see targetJavaVersion in
# build.gradle), pin it machine-locally in ~/.gradle/gradle.properties:
#   org.gradle.java.home=C:/Program Files/Amazon Corretto/jdk25.0.4_7
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.3
loader_version=0.19.5
# Mod Properties
mod_version=0.1.0-alpha
maven_group=org.malionaro
archives_base_name=dlss-frame-generation
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.161.0+26.3
