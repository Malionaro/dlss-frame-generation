name: Build and test

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    name: Windows · Java 25 · Native and JAR
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: gradle

      - name: Install Vulkan SDK (glslc + spirv-val for compileShaders)
        run: |
          winget install -e --id KhronosGroup.VulkanSDK --silent --accept-package-agreements --accept-source-agreements
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native bridge, shaders, tests and mod JAR
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: dlss-frame-generation-${{ github.sha }}
          path: |
            build/libs/dlss-frame-generation-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-build-reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            build/native/**/*.log
          if-no-files-found: ignore
          retention-days: 7
