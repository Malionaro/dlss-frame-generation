name: Publish to Modrinth & CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      modrinth_token_set:
        description: "Set to true if MODRINTH_TOKEN secret is configured (dry-run check only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish mod
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: gradle

      - name: Install Vulkan SDK (glslc + spirv-val for compileShaders)
        run: |
          winget install -e --id KhronosGroup.VulkanSDK --silent --accept-package-agreements --accept-source-agreements
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build release JAR
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Collect JAR
        id: jar
        run: |
          $jar = (Get-ChildItem build/libs/dlss-frame-generation-*.jar | Where-Object Name -notmatch "-sources" | Select-Object -First 1).FullName
          if (-not $jar) { throw "No mod JAR found" }
          "path=$jar" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "JAR: $jar"

      - name: Publish to Modrinth
        if: ${{ vars.MODRINTH_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ steps.jar.outputs.path }}
          name: ${{ github.event.release.name || github.ref_name }}
          version: ${{ github.event.release.tag_name || github.ref_name }}
          changelog: ${{ github.event.release.body || 'Automated publish' }}
          loaders: fabric
          game-versions: "26.3"
          dependencies: |
            fabric-api | depends | *
            fabricloader | depends | >=0.19.5
          fail-mode: fail

      - name: Publish to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: ${{ github.event.release.name || github.ref_name }}
          version: ${{ github.event.release.tag_name || github.ref_name }}
          changelog: ${{ github.event.release.body || 'Automated publish' }}
          loaders: fabric
          game-versions: "26.3"
          fail-mode: fail

      - name: No publish configured
        if: ${{ vars.MODRINTH_PROJECT_ID == '' && vars.CURSEFORGE_PROJECT_ID == '' }}
        run: Write-Host "::notice::No MODRINTH_PROJECT_ID/CURSEFORGE_PROJECT_ID vars set - skipped publish (build verified). Configure vars and MODRINTH_TOKEN/CURSEFORGE_TOKEN secrets to enable."
