name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: gradle

      - name: Resolve tag
        id: tag
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if (-not $tag) { $tag = (git describe --tags --abbrev=0 2>$null) }
          if (-not $tag) { $tag = "dev-${{ github.sha }}".Substring(0,16) }
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build native bridge, shaders, tests and mod JAR
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          Get-ChildItem build/libs/ | Format-Table Name,Length
          if (-not (Test-Path "build/libs/dlss-frame-generation-*.jar")) { throw "No mod JAR found" }
          $jar = (Get-ChildItem build/libs/dlss-frame-generation-*.jar | Where-Object Name -notmatch "-sources").FullName | Select-Object -First 1
          jar tf "$jar" | Select-String "dlss_fg_native|sl.interposer" | ForEach-Object { Write-Host $_ }
          if (-not (jar tf "$jar" | Select-String "dlss_fg_native.dll")) { throw "JAR missing dlss_fg_native.dll - copyNative failed" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            build/libs/dlss-frame-generation-*.jar
            !build/libs/*-sources.jar
          fail_on_unmatched_files: true
